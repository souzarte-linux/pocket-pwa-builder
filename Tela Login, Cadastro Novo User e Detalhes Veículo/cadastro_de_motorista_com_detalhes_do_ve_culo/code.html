<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #131313; }
        ::-webkit-scrollbar-thumb { background: #ff5f00; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-zinc-950 text-[#FF5F00] font-['Lexend'] font-black uppercase tracking-tighter docked full-width top-0 border-b-2 border-zinc-800 flex justify-between items-center w-full px-5 h-20 fixed z-50">
<div class="flex items-center gap-4">
<button class="hover:bg-zinc-800 transition-colors active:scale-95 duration-150 p-2 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-xl">CADASTRO MOTORISTA</h1>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="pt-24 pb-28 px-margin-main max-w-md mx-auto">
<!-- Profile Picture Section -->
<section class="mb-stack-lg text-center">
<div class="relative inline-block group">
<div class="w-32 h-32 rounded-full border-4 border-[#FF5F00] overflow-hidden bg-surface-container-high flex items-center justify-center">
<img alt="Avatar" class="w-full h-full object-cover opacity-60" data-alt="professional headshot of a smiling young man in a leather jacket against a neutral dark urban background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC46Ydr8SwBDbRtDRGuQa_D_X0O1z3HBiHHFmn2qUqcrQaMG949CraDsgDbhBF9y6vD9C9bjC9pHX0FHFR4eHAm0r-280TEvzUZjr9qAO7bon0nXFp85KsUeSKelCHYnpYNltBHpum8Jfoo3f8Qfi3rTaO0qUdWvb6YqdIDFl4GFhC6qH2xcf4myY0k1QsTN00Q6l-hwrMr4vtX997jk77_hZALrAAgJfjyevMiWq4Oit8US1Gh4RG1jyNMpKs3yxAVnIvE5kxQvos"/>
<span class="material-symbols-outlined absolute text-4xl text-on-surface/50" data-icon="add_a_photo">add_a_photo</span>
</div>
<div class="mt-4 flex justify-center gap-4">
<button class="flex flex-col items-center gap-1 group">
<div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center border-2 border-transparent group-active:border-primary-container transition-all">
<span class="material-symbols-outlined text-xl text-primary" data-icon="camera_alt">camera_alt</span>
</div>
<span class="font-label-md text-[10px] uppercase text-zinc-400">Câmera</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center border-2 border-transparent group-active:border-primary-container transition-all">
<span class="material-symbols-outlined text-xl text-primary" data-icon="photo_library">photo_library</span>
</div>
<span class="font-label-md text-[10px] uppercase text-zinc-400">Galeria</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center border-2 border-transparent group-active:border-primary-container transition-all">
<span class="material-symbols-outlined text-xl text-primary" data-icon="face">face</span>
</div>
<span class="font-label-md text-[10px] uppercase text-zinc-400">Avatares</span>
</button>
</div>
</div>
</section>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md">
<!-- Nome Completo -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-zinc-400 uppercase text-[10px] ml-1">Nome Completo</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-zinc-500" data-icon="person">person</span>
<input class="w-full h-touch-target-min bg-surface-container border-2 border-zinc-800 focus:border-[#FF5F00] outline-none px-12 font-label-md text-on-surface placeholder:text-zinc-600 transition-colors" placeholder="EX: JOÃO DA SILVA" type="text"/>
</div>
</div>
<!-- E-mail -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-zinc-400 uppercase text-[10px] ml-1">E-mail</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-zinc-500" data-icon="mail">mail</span>
<input class="w-full h-touch-target-min bg-surface-container border-2 border-zinc-800 focus:border-[#FF5F00] outline-none px-12 font-label-md text-on-surface placeholder:text-zinc-600 transition-colors" placeholder="EXEMPLO@EMAIL.COM" type="email"/>
</div>
</div>
<!-- Celular + WhatsApp -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-zinc-400 uppercase text-[10px] ml-1">Celular</label>
<div class="flex gap-2">
<div class="relative flex-1 flex items-center">
<span class="material-symbols-outlined absolute left-4 text-zinc-500" data-icon="smartphone">smartphone</span>
<input class="w-full h-touch-target-min bg-surface-container border-2 border-zinc-800 focus:border-[#FF5F00] outline-none px-12 font-label-md text-on-surface placeholder:text-zinc-600 transition-colors" placeholder="(00) 00000-0000" type="tel"/>
</div>
<label class="flex items-center gap-2 bg-surface-container border-2 border-zinc-800 px-3 cursor-pointer hover:bg-zinc-800 transition-colors">
<input class="w-5 h-5 rounded-none accent-[#FF5F00] bg-zinc-900 border-zinc-700" type="checkbox"/>

</label>
</div>
</div>
<!-- Rede Social -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-zinc-400 uppercase text-[10px] ml-1">Rede Social (Opcional)</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-zinc-500" data-icon="share">share</span>
<input class="w-full h-touch-target-min bg-surface-container border-2 border-zinc-800 focus:border-[#FF5F00] outline-none px-12 font-label-md text-on-surface placeholder:text-zinc-600 transition-colors" placeholder="@SEUUSUARIO" type="text"/>
</div>
</div>
<!-- Veículo Grid -->
<div class="grid grid-cols-2 gap-2">
<div class="flex flex-col gap-1">
<label class="font-label-md text-zinc-400 uppercase text-[10px] ml-1">Veículo</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-zinc-500" data-icon="directions_bike">directions_bike</span>
<select class="w-full h-touch-target-min bg-surface-container border-2 border-zinc-800 focus:border-[#FF5F00] outline-none px-12 font-label-md text-on-surface appearance-none transition-colors">
<option value="moto">Moto</option>
<option value="carro">Carro</option>
<option value="bike">Bike</option>
</select>
<span class="material-symbols-outlined absolute right-4 text-zinc-500 pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-zinc-400 uppercase text-[10px] ml-1">Placa</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-zinc-500" data-icon="pin">pin</span>
<input class="w-full h-touch-target-min bg-surface-container border-2 border-zinc-800 focus:border-[#FF5F00] outline-none px-12 font-label-md text-on-surface placeholder:text-zinc-600 transition-colors uppercase" placeholder="ABC-1234" type="text"/>
</div>
</div>
</div><div class="flex justify-end mt-1">
<button class="flex items-center gap-2 text-primary hover:text-[#FF7A00] transition-colors group" type="button">
<span class="font-label-md text-[10px] uppercase tracking-wider">Configurações Detalhadas</span>
<span class="material-symbols-outlined text-sm" data-icon="settings">settings</span>
</button>
</div>
<!-- Senhas Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-md text-zinc-400 uppercase text-[10px] ml-1">Senha</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-zinc-500" data-icon="lock">lock</span>
<input class="w-full h-touch-target-min bg-surface-container border-2 border-zinc-800 focus:border-[#FF5F00] outline-none px-12 font-label-md text-on-surface placeholder:text-zinc-600 transition-colors" placeholder="********" type="password"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-zinc-400 uppercase text-[10px] ml-1">Confirmar Senha</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-zinc-500" data-icon="verified_user">verified_user</span>
<input class="w-full h-touch-target-min bg-surface-container border-2 border-zinc-800 focus:border-[#FF5F00] outline-none px-12 font-label-md text-on-surface placeholder:text-zinc-600 transition-colors" placeholder="********" type="password"/>
</div>
</div>
</div>
<!-- Botão Finalizar -->
<button class="mt-4 bg-primary-container hover:bg-[#FF7A00] text-on-primary-container h-16 font-headline-md uppercase tracking-widest active:scale-95 transition-all shadow-lg flex items-center justify-center gap-3" type="submit">
<span class="">FINALIZAR CADASTRO</span>
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</button>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-zinc-950 px-4 pb-safe border-t-2 border-zinc-800">
<button class="flex flex-col items-center justify-center text-zinc-500 pt-2 pb-safe hover:text-white transition-all active:bg-zinc-900 group">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
<span class="font-['Lexend'] font-bold text-[12px] uppercase">Voltar</span>
</button>
<button class="flex flex-col items-center justify-center text-zinc-500 pt-2 pb-safe hover:text-white transition-all active:bg-zinc-900 group">
<span class="material-symbols-outlined text-2xl" data-icon="help">help</span>
<span class="font-['Lexend'] font-bold text-[12px] uppercase">Ajuda</span>
</button>
</nav>
</body></html>
